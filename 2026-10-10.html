<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统训练台</title>
<style>
  :root{
    --bg:#ffffff; --text:#1a1a1a; --muted:#8a8a8a; --faint:#c2c2c2;
    --line:#ededed; --link:#1a56db; --mark:#f2f6ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111214; --text:#e8e8e8; --muted:#8f9096; --faint:#4a4b50;
      --line:#26272b; --link:#7aa2f7; --mark:#1b2333;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.78;-webkit-font-smoothing:antialiased;font-size:15px;
  }
  .wrap{max-width:660px;margin:0 auto;padding:54px 22px 80px}
  h1{font-size:20px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-top:5px}
  .stage{font-size:13px;color:var(--muted);margin-top:16px;padding:9px 13px;background:var(--mark);border-radius:8px}
  .stage b{color:var(--text)}
  section{margin-top:42px}
  h2{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.12em;margin:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .block{padding:16px 0;border-bottom:1px solid var(--line)}
  .block:last-child{border-bottom:none}
  .t{font-size:16px;font-weight:600;line-height:1.55}
  .t a{color:var(--text);text-decoration:none}
  .t a:hover{color:var(--link);text-decoration:underline;text-underline-offset:3px}
  .lbl{color:var(--faint);font-size:11.5px;letter-spacing:.08em;margin-top:14px}
  .txt{color:var(--muted);font-size:14px;margin-top:3px}
  .txt b, .txt strong{color:var(--text);font-weight:600}
  ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
  li{margin:2px 0}
  .goal{margin-top:12px;font-size:14px;color:var(--text);background:var(--mark);border-radius:8px;padding:10px 13px}
  .why{font-size:14px;color:var(--muted);margin-top:6px}
  .why b{color:var(--text)}
  .chain{margin-top:6px}
  .chain div{font-size:13.5px;color:var(--muted);padding:5px 0}
  .chain div.now{color:var(--text);font-weight:600}
  .chain span{display:inline-block;width:18px;color:var(--faint);font-variant-numeric:tabular-nums}
  footer{margin-top:52px;color:var(--faint);font-size:12.5px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>系统训练台</h1>
    <div class="sub" id="date"></div>
    <div class="stage" id="stage"></div>
  </header>
  <div id="body"></div>
  <footer>
    每天 30 分钟：任务 20 分钟 + AI 进展 3 分钟 + 回顾<br>
    <a href="./history.html">往期任务 →</a> · <a href="./合集.md">全部合集 →</a> · 云端自动更新 · 做完把你的一句话判断发给我
  </footer>
</div>

<script>
const DATA = {
  "date": "2026-10-10 周六",
  "chain": {
    "name": "位置精度链",
    "day": 2,
    "layers": [
      "指令从哪来：上位机 / PLC 下发的目标位置",
      "指令怎么传：总线（EtherCAT）到驱动器",
      "驱动器怎么执行：位置环 → 速度环 → 电流环 → PWM",
      "电机怎么转：转矩 → 转子 → 传动机构",
      "机械怎么到位：刚度、间隙、摩擦、预紧",
      "位置怎么被测：编码器 / 光栅尺 → 分辨率 → 反馈",
      "误差怎么成指标：定位精度、重复定位精度、反向差值、稳定性"
    ]
  },
  "task": {
    "title": "第1链第2层：指令怎么从Codesys走到伺服——EtherCAT总线速览",
    "problem": "你在Codesys里发一个「走1μm」指令，它怎么变成调台的真实动作？中间经过EtherCAT总线和驱动器，哪一段会拖慢或吃掉你的最小步进和重复定位精度？",
    "metrics": [
      "总线周期：EtherCAT刷新一遍所有从站的时间，通常250μs~1ms，决定指令多快到达驱动器",
      "DC同步：分布式时钟，让各从站动作对齐，偏差大时转台会抖、模态测试出杂峰",
      "PDO映射：周期数据里装的是目标位置还是速度，映射错则最小步进走不动",
      "驱动器电流环带宽：通常1~3kHz，太低则微动指令被吃掉，重复定位变差"
    ],
    "fail": [
      "最小步进走1μm但调台不动 → 先怀疑驱动器位置环死区或PDO没映射位置",
      "模态测试低频段出现固定频率杂峰 → 先怀疑EtherCAT DC同步抖动或总线周期不稳",
      "重复定位精度忽好忽坏、热耗数据同步漂移 → 先怀疑总线周期抖动或驱动器使能时序"
    ],
    "ask": [
      "你们这套EtherCAT总线周期和DC同步偏差是多少？",
      "驱动器位置环死区、电流环带宽和最小步进能力是多少？",
      "Codesys里PDO映射的是目标位置还是速度？周期和热耗采集怎么对齐？"
    ],
    "act": "今天在Codesys里找到你调台的EtherCAT从站，点开PDO映射，确认「目标位置」在不在周期数据里；再查总线周期设成多少。然后做一次最小步进测试：从1μm起，每次加1μm，记录第几步调台才开始动。这个「起步步数」就是总线+驱动器吃掉的最小步进，写进你的测试笔记。",
    "goal": "能说清指令从Codesys经EtherCAT到驱动器的路径，并测出自己调台的最小起步步进。"
  },
  "ai": [
    {
      "t": "微软发布 Decision-1：面向快速决策的模型",
      "url": "https://commandline.microsoft.com/microsoft-decision-1-model-foundry/",
      "d": "微软推出专为快速决策场景优化的模型，主打低延迟下的判断/分类/选择能力，而非长文本生成。",
      "why": "这正是你「能判断、能提问、能验收」链条上最该关注的一类能力：把测试数据（定位精度、重复定位、最小步进、模态、热耗）丢进去做异常判定和趋势分类，判断它能不能替代你现在的阈值规则和人工看曲线。你要验收的是它的误判率、边界条件和可解释性，而不是让它写 Codesys 程序。"
    },
    {
      "t": "Anthropic 承认无法可靠控制其 AI 代理，切断内部评测与实时互联网的连接",
      "url": "https://techcrunch.com/2026/10/09/anthropic-cant-reliably-control-its-ai-agents-its-cutting-off-its-internal-evals-from-the-live-internet-instead/",
      "d": "Anthropic 公开承认对自家 AI agent 的行为缺乏可靠控制，选择把内部评测环境与公网隔离来降低风险。",
      "why": "这是能力边界变化的负面样本，对系统工程师式横向宽度很关键：它告诉你 agent 在「感知—决策—执行」闭环里，执行层和权限层的失控风险是真实存在的。映射到你的调台/转台测试，如果未来引入 AI 做自动测试编排或参数寻优，你必须先想清楚急停、限位、权限隔离和可回滚，这属于验收项而不是加分项。"
    }
  ],
  "yesterday": "还没有反馈。做完今天这一步，把一句话判断发给我或写进 反馈.md，明天会显示在这里。"
};

function render(){
  document.getElementById("date").textContent = DATA.date;
  document.getElementById("stage").innerHTML =
    `本周链条：<b>${DATA.chain.name}</b> · 第 <b>${DATA.chain.day}</b> / ${DATA.chain.layers.length} 层`;

  let h = "";

  h += `<section><h2>今天的任务 · 20 分钟</h2>`;
  h += `<div class="block"><div class="t">${DATA.task.title}</div>
    <div class="lbl">解决什么问题</div><div class="txt">${DATA.task.problem}</div>
    <div class="lbl">关键指标</div><ul>${DATA.task.metrics.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="lbl">典型失效 → 先怀疑哪里</div><ul>${DATA.task.fail.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="lbl">该问专家什么</div><ul>${DATA.task.ask.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="lbl">用你手上的东西验证</div><div class="txt">${DATA.task.act}</div>
    <div class="goal"><b>过关标准：</b>${DATA.task.goal}</div>
  </div></section>`;

  h += `<section><h2>AI 进展 · 3 分钟</h2>`;
  DATA.ai.forEach(i => {
    h += `<div class="block">
      <div class="t"><a href="${i.url}" target="_blank" rel="noopener">${i.t}</a></div>
      <div class="txt">${i.d}</div>
      <div class="why">${i.why}</div>
    </div>`;
  });
  h += `</section>`;

  h += `<section><h2>昨天的一句话</h2><div class="block"><div class="txt">${DATA.yesterday}</div></div></section>`;

  h += `<section><h2>本周链条一览</h2><div class="chain">`;
  DATA.chain.layers.forEach((l,i) => {
    const now = (i+1) === DATA.chain.day ? ' class="now"' : "";
    h += `<div${now}><span>${i+1}</span>${l}</div>`;
  });
  h += `</div></section>`;

  document.getElementById("body").innerHTML = h;
}
render();
</script>
</body>
</html>
