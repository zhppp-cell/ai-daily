<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>往期任务 · 系统训练台</title>
<style>
  :root{
    --bg:#ffffff; --text:#1a1a1a; --muted:#8a8a8a; --faint:#c2c2c2;
    --line:#ededed; --link:#1a56db; --mark:#f2f6ff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111214; --text:#e8e8e8; --muted:#8f9096; --faint:#4a4b50;
      --line:#26272b; --link:#7aa2f7; --mark:#1b2333;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.78;-webkit-font-smoothing:antialiased;font-size:15px;
  }
  .wrap{max-width:660px;margin:0 auto;padding:54px 22px 80px}
  h1{font-size:20px;margin:0;font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-top:5px}
  .sub a{color:var(--link);text-decoration:none}
  details{border-bottom:1px solid var(--line);padding:14px 0}
  summary{cursor:pointer;font-size:15px;line-height:1.6;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"▸ ";color:var(--faint)}
  details[open] summary::before{content:"▾ "}
  summary .d{color:var(--muted);font-size:13px}
  summary .c{color:var(--muted);font-size:13px}
  .body{padding:12px 0 4px 16px;border-left:2px solid var(--line);margin-top:10px}
  .lbl{color:var(--faint);font-size:11.5px;letter-spacing:.08em;margin-top:12px}
  .txt{color:var(--muted);font-size:14px;margin-top:3px}
  ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
  li{margin:2px 0}
  .goal{margin-top:12px;font-size:14px;background:var(--mark);border-radius:8px;padding:10px 13px}
  .aitem{margin-top:8px}
  .aitem a{color:var(--link);text-decoration:none;font-size:14px}
  footer{margin-top:44px;color:var(--faint);font-size:12.5px}
  footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>往期任务</h1>
  <div class="sub">共 __COUNT__ 天 · <a href="./index.html">← 回今天的训练台</a></div>
  <div id="list">
__ITEMS__
  </div>
  <footer>每天 30 分钟 · 由云端自动累积，最新的排在最上面</footer>
</div>
</body>
</html>
