name: 每日更新

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      render_only:
        description: "只重建页面（不生成新内容、不推进进度）"
        type: boolean
        default: false

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 生成或重建页面
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ "${{ inputs.render_only }}" = "true" ]; then
            python 工具/每日更新.py --render-only
          else
            python 工具/每日更新.py
          fi
      - name: 准备 Pages
        uses: actions/configure-pages@v5
      - name: 打包
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 发布网站
        id: deploy
        uses: actions/deploy-pages@v4