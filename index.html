<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 日报</title>
<style>
  :root{
    --bg:#ffffff; --text:#1a1a1a; --muted:#8a8a8a; --faint:#c2c2c2;
    --line:#ededed; --link:#1a56db;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111214; --text:#e8e8e8; --muted:#8f9096; --faint:#4a4b50;
      --line:#26272b; --link:#7aa2f7;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.75;-webkit-font-smoothing:antialiased;font-size:15px;
  }
  .wrap{max-width:660px;margin:0 auto;padding:56px 22px 80px}

  h1{font-size:20px;margin:0;font-weight:600}
  .date{color:var(--muted);font-size:13px;margin-top:4px}
  .lead{color:var(--muted);font-size:13.5px;margin-top:14px}

  section{margin-top:44px}
  h2{
    font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.12em;
    margin:0;padding-bottom:8px;border-bottom:1px solid var(--line);
  }
  .item{padding:16px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .t{font-size:16px;font-weight:600;line-height:1.5}
  .t a{color:var(--text);text-decoration:none}
  .t a:hover{color:var(--link);text-decoration:underline;text-underline-offset:3px}
  .d{color:var(--muted);font-size:14px;margin-top:5px}
  .s{color:var(--faint);font-size:12px;margin-top:6px}
  .num{display:inline-block;width:20px;color:var(--faint);font-variant-numeric:tabular-nums}
  .how{color:var(--muted);font-size:14px;margin-top:6px}
  .how b{color:var(--text);font-weight:600}

  footer{margin-top:56px;color:var(--faint);font-size:12.5px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 日报</h1>
    <div class="date" id="date"></div>
    <div class="lead" id="lead"></div>
  </header>
  <div id="body"></div>
  <footer>
    来源：Hacker News、TechCrunch、arXiv、GitHub<br>
    摘要依据原文标题整理，链接为原文 · 每天自动更新
  </footer>
</div>

<script>
const DATA = {
  date: "2026 年 10 月 9 日",
  lead: "4 条要闻 · 2 条使用技巧 · 1 个可用技能 · 2 篇论文",
  news: [
    {t:"OpenAI 分享数学领域的 AI 进展",
     d:"官方公布 AI 在数学研究上的进展，是这两天讨论度最高的一条。",
     url:"https://openai.com/index/sharing-ai-progress-in-mathematics/",
     s:"openai.com · 讨论热度 1307"},
    {t:"Anthropic 发布 Claude Haiku 5.5",
     d:"轻量快速版本的更新，主要面向高频调用、低成本的场景。",
     url:"https://www.anthropic.com/claude-haiku-5-5",
     s:"anthropic.com · 讨论热度 993"},
    {t:"OpenAI 发布 GPT-6：面向所有人的智能界面",
     d:"新一代模型发布，重点放在把模型能力变成日常的界面体验。",
     url:"https://openai.com/index/gpt-6-for-everyone/",
     s:"openai.com · 讨论热度 723"},
    {t:"OpenAI 撤回三篇数学结果",
     d:"官方仓库记录了三篇数学结果的撤回，可以和上面的「进展」对照着看。",
     url:"https://github.com/openai/math/blob/main/history.md",
     s:"github.com · 讨论热度 335"}
  ],
  tips: [
    {t:"先要提纲，再要正文",
     how:"让 AI <b>先把结构和要点列出来</b>，你看过、点头之后，再让它展开写。一次就写对的概率高很多，返工明显减少。",
     s:"适用：写报告、写方案、写文章"},
    {t:"给样例，别给形容词",
     how:"把你满意的样子直接贴给它，说「<b>照这个来</b>」。这比写一堆「专业一点、简洁一点」有效得多，因为它能照着格式对齐。",
     s:"适用：格式、语气、排版"}
  ],
  skills: [
    {t:"文档、表格、PDF，本机已经能处理",
     how:"直接说「把这份 PDF 读出来」「用这张表做个汇总」「照这个模板出一份 Word」就行，对应的能力本机已经装好，不需要额外配置。",
     s:"文档 · 表格 · PDF · 演示文稿"}
  ],
  papers: [
    {t:"Long-WAM：扩展世界-动作模型的上下文长度",
     d:"让「世界模型 + 动作」这类方法能处理更长的上下文。",
     url:"http://arxiv.org/abs/2610.10528v1",
     s:"arXiv cs.AI · 10-07"},
    {t:"RoboJEPA：扩展机器人潜在世界模型",
     d:"面向机器人学习的潜在世界模型扩展工作。",
     url:"http://arxiv.org/abs/2610.10515v1",
     s:"arXiv cs.AI · 10-07"}
  ]
};

function render(){
  document.getElementById("date").textContent = DATA.date;
  document.getElementById("lead").textContent = DATA.lead;
  let h = "";

  h += `<section><h2>今日要闻</h2>`;
  DATA.news.forEach((i,n) => {
    h += `<div class="item">
      <div class="t"><span class="num">${n+1}</span><a href="${i.url}" target="_blank" rel="noopener">${i.t}</a></div>
      <div class="d">${i.d}</div>
      <div class="s">${i.s}</div>
    </div>`;
  });
  h += `</section>`;

  if (DATA.tips.length) {
    h += `<section><h2>技能与技巧</h2>`;
    DATA.tips.forEach(i => {
      h += `<div class="item">
        <div class="t">${i.t}</div>
        <div class="how">${i.how}</div>
        <div class="s">${i.s}</div>
      </div>`;
    });
    h += `</section>`;
  }

  if (DATA.skills.length) {
    h += `<section><h2>顺手能用</h2>`;
    DATA.skills.forEach(i => {
      h += `<div class="item">
        <div class="t">${i.t}</div>
        <div class="how">${i.how}</div>
        <div class="s">${i.s}</div>
      </div>`;
    });
    h += `</section>`;
  }

  if (DATA.papers.length) {
    h += `<section><h2>论文速览</h2>`;
    DATA.papers.forEach(i => {
      h += `<div class="item">
        <div class="t"><a href="${i.url}" target="_blank" rel="noopener">${i.t}</a></div>
        <div class="d">${i.d}</div>
        <div class="s">${i.s}</div>
      </div>`;
    });
    h += `</section>`;
  }

  document.getElementById("body").innerHTML = h;
}
render();
</script>
</body>
</html>
